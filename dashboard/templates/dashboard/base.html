{% load static %}
<!DOCTYPE html>
<html lang="en" >
  <!--begin::Head-->
  <head>
    <meta charset="utf-8">
    <title>{% block title %}Fleet Management System{% endblock %}</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">

    <!--begin::Fonts-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/source-sans-3@5.0.12/index.css" integrity="sha256-tXJfXfp6Ewt1ilPzLDtQnJV4hclT9XuaZUKyUvmyr+Q=" crossorigin="anonymous" media="print" onload="this.media = 'all'"/>
    <!--end::Fonts-->

    <!--begin::Third Party Plugin(OverlayScrollbars)-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/overlayscrollbars@2.11.0/styles/overlayscrollbars.min.css" crossorigin="anonymous"/>
    <!--end::Third Party Plugin(OverlayScrollbars)-->

    <!--begin::Third Party Plugin(Bootstrap Icons)-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" crossorigin="anonymous"/>
    <!--end::Third Party Plugin(Bootstrap Icons)-->

    <!--begin::Required Plugin(AdminLTE)-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@4.0.0-beta3/dist/css/adminlte.min.css">
    <!--end::Required Plugin(AdminLTE)-->

    <!--begin::Required Extra CSS-->
    {% block extra_css %}{% endblock %}
    <!--end::Required Extra CSS-->

    <style>
      html, body {
        height: 100%;
        overflow: hidden;
      }
      .app-wrapper {
        height: 100%;
        overflow: hidden;
      }
      .table td,
      .table th {
        vertical-align: middle !important;
      }
      /* Bigger cards + better shadow */
.kpi-card {
    border: none;
    border-radius: 16px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
    transition: 0.2s ease;
}

/* Hover effect (optional but nice) */
.kpi-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 14px 35px rgba(0, 0, 0, 0.12);
}

/* Icon box bigger */
.icon-box {
    width: 60px;
    height: 60px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
}
    </style>
  </head>
  <!--end::Head-->

  <!--begin::Body-->
  <body class="layout-fixed layout-navbar-fixed sidebar-expand-lg sidebar-mini">
    <!--begin::App Wrapper-->
    <div class="app-wrapper">
      <!--begin::Header-->
      {% include "dashboard/partials/header.html" %}
      <!--end::Header-->

      <!--begin::Sidebar-->
      {% include "dashboard/partials/sidebar.html" %}
      <!--end::Sidebar-->

      <!--begin::App Main Content-->
      {% block content %}{% endblock %}
      <!--end::App Main Content-->
    </div>
    <!--end::App Wrapper-->

    <!--begin::Script-->
    <!--begin::Third Party Plugin(OverlayScrollbars)-->
    <script src="https://cdn.jsdelivr.net/npm/overlayscrollbars@2.11.0/browser/overlayscrollbars.browser.es6.min.js" crossorigin="anonymous"></script>
    <!--end::Third Party Plugin(OverlayScrollbars)-->

    <!--begin::Required Plugin(Bootstrap 5)-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

    <!-- AdminLTE 4 JS -->
    <script src="https://cdn.jsdelivr.net/npm/admin-lte@4.0.0-beta3/dist/js/adminlte.min.js"></script>
    <!--end::Required Plugin(AdminLTE)-->

    <!-- Alpine.js -->
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <!-- ApexCharts -->
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>

    <!--begin::OverlayScrollbars Configure-->
    <script>
      const SELECTOR_SIDEBAR_WRAPPER = '.sidebar-wrapper';
      const Default = {
        scrollbarTheme: 'os-theme-light',
        scrollbarAutoHide: 'leave',
        scrollbarClickScroll: true,
      };
      document.addEventListener('DOMContentLoaded', function () {
        const sidebarWrapper = document.querySelector(SELECTOR_SIDEBAR_WRAPPER);

        // Disable OverlayScrollbars on mobile devices to prevent touch interference
        const isMobile = window.innerWidth <= 992;

        if ( sidebarWrapper && OverlayScrollbarsGlobal?.OverlayScrollbars !== undefined && !isMobile) {
          OverlayScrollbarsGlobal.OverlayScrollbars(sidebarWrapper, {
            scrollbars: {
              theme: Default.scrollbarTheme,
              autoHide: Default.scrollbarAutoHide,
              clickScroll: Default.scrollbarClickScroll,
            },
          });
        }
      });
    </script>
    <!--end::OverlayScrollbars Configure-->

    <!--begin::DarkMode Configure-->
    <script>
      (() => {
        const btn = document.getElementById("themeToggleBtn");
        const icon = document.getElementById("themeIcon");
        const getSystemTheme = () => window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        const applyTheme = (theme) => {document.documentElement.setAttribute("data-bs-theme", theme);
          if (theme === "dark") {
            icon.className = "bi bi-moon-fill";
          } else {
            icon.className = "bi bi-sun-fill";
          }
        };
        // Load saved or system theme
        let savedTheme = localStorage.getItem("theme") || getSystemTheme();
        applyTheme(savedTheme);

        // Toggle on click
        btn.addEventListener("click", (e) => {
        e.preventDefault();

        let currentTheme = document.documentElement.getAttribute("data-bs-theme");
        let newTheme = currentTheme === "dark" ? "light" : "dark";
        localStorage.setItem("theme", newTheme);
        applyTheme(newTheme);
        });
      })();
    </script>
    <!--end::DarkMode Configure-->

    <!--begin::Required Extra JS-->
    {% block extra_js %}{% endblock %}
    <!--end::Required Extra JS-->

    <!--end::Script-->
  </body>
  <!--end::Body-->

</html>
