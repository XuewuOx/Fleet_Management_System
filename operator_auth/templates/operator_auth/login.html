{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fleet Management System - Login</title>
    <link rel="stylesheet" href="{% static 'styles/login.css' %}">
    <style>
        .error-box {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            margin-bottom: 20px;
            border-radius: 8px;
            background: #ffecec;
            border: 1px solid #f5c2c2;
            color: #c0392b;
            font-size: 12px;
            font-weight: 500;
            animation: fadeIn 0.3s ease-in-out;
        }

        .error-icon {
            font-size: 12px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-4px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- LEFT SIDE LOGIN FORM -->
    <div class="left-panel">
        <h2>Login</h2>
        <p>Welcome to Fleet Management System</p>
        {% if error %}
        <div class="error-box">
            <span class="error-icon">⚠</span>
            <span>{{ error }}</span>
        </div>
        {% endif %}
        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <input type="text" name="username" placeholder="Username or Email" required autofocus>
            </div>

            <div class="form-group">
                <input type="password" name="password" placeholder="Password" required>
            </div>

            <button type="submit" class="btn-login">
                Log In
            </button>
        </form>

        <!-- <div class="extra-links"> Don’t have an account? <a href="#">Register</a> </div> -->
    </div>

    <!-- RIGHT SIDE IMAGE -->
    <div class="right-panel">
        <img src="{% static 'images/operator_auth.png' %}" alt="Management System">
    </div>

</div>

</body>
</html>
